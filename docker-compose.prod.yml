version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: logersn_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-gaak4328_loger_app}
      POSTGRES_USER: ${DB_USER:-loger_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loger_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logersn_web
    restart: always
    command: gunicorn logersenegal.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8099:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
